services:

  app:
    image: ghcr.io/ighorn1/fun:latest   # pulled from GitHub Container Registry
    # build: .                           # uncomment to build locally instead
    ports:
      - "8000:8000"
    environment:
      # Optional: point to the ollama service below to enable AI fallback
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── Optional Ollama service (AI table extraction fallback) ─────────────────
  # Remove this block if you don't need the AI fallback feature
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment the lines below if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
